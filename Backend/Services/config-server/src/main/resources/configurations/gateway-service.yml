spring:
  cloud:
    gateway:
      routes:
        # Authentication Service
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        # OAuth2 Authorization Service
        - id: oauth2-service
          uri: http://localhost:8080
          predicates:
            - Path=/oauth2/**
          filters:
            - StripPrefix=0

        # Parent Service
        - id: parent-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/parents/**
          filters:
            - StripPrefix=0

        # Parent Service - Tickets
        - id: parent-tickets-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/tickets/**
          filters:
            - StripPrefix=0

        # Parent Service - Test
        - id: parent-test-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/test/**
          filters:
            - StripPrefix=0

        # School Service
        - id: school-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/school/**
          filters:
            - StripPrefix=0

        # Admin Service
        - id: admin-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:5173"
              - "http://localhost:8081"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:3001"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:8081"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}

# Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.example.gateway: DEBUG
